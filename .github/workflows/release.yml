name: Build & Release Passwall Android Magisk Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      xray_version:
        description: 'Optional Xray-core tag (leave empty for latest)'
        required: false
        default: ''
      module_version:
        description: 'Optional module version (e.g. v1.2.4, leave empty to auto-derive from tag/branch)'
        required: false
        default: ''
      module_version_code:
        description: 'Optional module versionCode (e.g. 124, leave empty to auto-derive)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Resolve latest Xray-core release tag
        id: xray
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VER: ${{ github.event.inputs.xray_version }}
        run: |
          if [ -n "$INPUT_VER" ]; then
            TAG="$INPUT_VER"
          else
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=1" \
              | jq -r '.[0].tag_name // empty')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG="v26.11.9"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved Xray-core tag: $TAG"

      - name: Build universal Magisk ZIP (ARMv7 + ARM64)
        env:
          XRAY_VER: ${{ steps.xray.outputs.tag }}
          INPUT_MOD_VER: ${{ github.event.inputs.module_version }}
          INPUT_MOD_CODE: ${{ github.event.inputs.module_version_code }}
        run: |
          if [ -n "$INPUT_MOD_VER" ]; then
            MOD_VER="$INPUT_MOD_VER"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            MOD_VER="${GITHUB_REF_NAME}"
          else
            MOD_VER="v1.2.4-${XRAY_VER}"
          fi

          if [ -n "$INPUT_MOD_CODE" ]; then
            MOD_CODE="$INPUT_MOD_CODE"
          elif [[ "${MOD_VER}" =~ ^v?([0-9]+)\.([0-9]+)(\.([0-9]+))? ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[4]:-0}"
            MOD_CODE=$(( 10#$MAJOR * 100 + 10#$MINOR * 10 + 10#$PATCH ))
          else
            MOD_CODE=$(grep -E '^versionCode=' module/module.prop | cut -d= -f2 || echo 124)
          fi

          echo "MOD_VER=${MOD_VER}" >> "$GITHUB_ENV"
          echo "MOD_CODE=${MOD_CODE}" >> "$GITHUB_ENV"
          echo "Building module version: ${MOD_VER} (versionCode: ${MOD_CODE})..."
          chmod +x build.sh
          ./build.sh "${MOD_VER}" "${MOD_CODE}" "${XRAY_VER}"
          sha256sum "passwall-android-${MOD_VER}-universal.zip" > "passwall-android-${MOD_VER}-universal.zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.module_version != '' && github.event.inputs.module_version || format('xray-{0}', steps.xray.outputs.tag)) }}
          name: Passwall Android ${{ env.MOD_VER }} (Xray ${{ steps.xray.outputs.tag }})
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            passwall-android-${{ env.MOD_VER }}-universal.zip
            passwall-android-${{ env.MOD_VER }}-universal.zip.sha256
